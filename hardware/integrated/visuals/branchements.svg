<text x="1092" y="944" font-size="19" fill="#516C79" font-weight="400" text-anchor="start">Adaptateurs et détrompages à valider.</text>
<text x="1092" y="972" font-size="19" fill="#516C79" font-weight="400" text-anchor="start">Aucun branchement direct présumé.</text>
