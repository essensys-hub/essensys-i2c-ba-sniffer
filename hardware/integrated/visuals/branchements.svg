<text x="82" y="881" font-size="19" fill="#007E81" font-weight="700" text-anchor="start">01 / CAPTURE PASSIVE</text>
<text x="82" y="916" font-size="19" fill="#516C79" font-weight="400" text-anchor="start">Le bus passe de J1 à J2.</text>
<text x="82" y="944" font-size="19" fill="#516C79" font-weight="400" text-anchor="start">L&#x27;analyseur observe SDA/SCL.</text>
<text x="82" y="972" font-size="19" fill="#516C79" font-weight="400" text-anchor="start">Aucune injection de commande I2C.</text>
<rect x="565" y="845" width="470" height="158" rx="16" fill="white" stroke="#D4E0E7" stroke-width="2"/>
<text x="587" y="881" font-size="19" fill="#7252B4" font-weight="700" text-anchor="start">02 / PROGRAMMATION</text>
<text x="587" y="916" font-size="19" fill="#516C79" font-weight="400" text-anchor="start">Un seul port actif à la fois : BP ou BA.</text>
<text x="587" y="944" font-size="19" fill="#516C79" font-weight="400" text-anchor="start">BP : BDM. BA : ICSP, pas JTAG.</text>
<text x="587" y="972" font-size="19" fill="#516C79" font-weight="400" text-anchor="start">UF2 actuel : diagnostic uniquement.</text>
<rect x="1070" y="845" width="470" height="158" rx="16" fill="white" stroke="#D4E0E7" stroke-width="2"/>
