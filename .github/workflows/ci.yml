name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sigrok-cli (oracle du décodeur I2C)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sigrok-cli
      - run: pip install -e '.[dev]'
      - run: pytest -q

  anonymisation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Aucune IP de LAN privé ni adresse MAC dans le dépôt public
        run: |
          if git grep -nIE '\b192\.168\.[0-9]+\.[0-9]+|\b([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}\b' -- . ':!.github/workflows/ci.yml'; then
            echo "Donnée réseau privée détectée : remplacer par un marqueur (<ip-gateway>) ou la plage RFC 5737." >&2
            exit 1
          fi

  kicad:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: ERC / DRC de la sonde
        shell: bash
        run: |
          shopt -s nullglob
          sch=(hardware/kicad/*.kicad_sch); pcb=(hardware/kicad/*.kicad_pcb)
          if [ ${#sch[@]} -eq 0 ]; then echo "Pas encore de schéma KiCad (groupe 5) : contrôle ignoré."; exit 0; fi
          for f in "${sch[@]}"; do kicad-cli sch erc --exit-code-violations -o /tmp/erc.rpt "$f"; done
          for f in "${pcb[@]}"; do kicad-cli pcb drc --exit-code-violations -o /tmp/drc.rpt "$f"; done
