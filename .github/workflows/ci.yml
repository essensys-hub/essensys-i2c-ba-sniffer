name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sigrok-cli (oracle du décodeur I2C)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sigrok-cli
      - run: pip install -e '.[dev]'
      - run: pytest -q

  anonymisation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Aucune IP de LAN privé ni adresse MAC dans le dépôt public
        run: |
          if git grep -nIE '\b192\.168\.[0-9]+\.[0-9]+|\b([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}\b' -- . ':!.github/workflows/ci.yml'; then
            echo "Donnée réseau privée détectée : remplacer par un marqueur (<ip-gateway>) ou la plage RFC 5737." >&2
            exit 1
          fi

  kicad:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: ERC / DRC de la sonde
        shell: bash
        run: |
          shopt -s nullglob
          sch=(hardware/kicad/*.kicad_sch); pcb=(hardware/kicad/*.kicad_pcb)
          if [ ${#sch[@]} -eq 0 ]; then echo "Pas encore de schéma KiCad (groupe 5) : contrôle ignoré."; exit 0; fi
          for f in "${sch[@]}"; do kicad-cli sch erc --exit-code-violations -o /tmp/erc.rpt "$f"; done
          kicad-cli sch export netlist --format kicadsexpr -o /tmp/sonde.net hardware/kicad/sonde-i2c-passive.kicad_sch
          python3 hardware/kicad/check_netlist.py /tmp/sonde.net
          for f in "${pcb[@]}"; do kicad-cli pcb drc --exit-code-violations -o /tmp/drc.rpt "$f"; done
      - name: ERC et contrat électrique de l'étude Pico 2 (acquisition seule)
        run: |
          kicad-cli sch erc --exit-code-violations -o /tmp/pico-erc.rpt hardware/pico2/pico2-capture-draft.kicad_sch
          kicad-cli sch export netlist --format kicadxml -o /tmp/pico.xml hardware/pico2/pico2-capture-draft.kicad_sch
          python3 hardware/pico2/check_netlist.py /tmp/pico.xml
      - name: Étude intégrée R0 — nets et avertissements ERC explicites
        run: |
          kicad-cli sch erc --format json --severity-all -o /tmp/integrated-erc.json hardware/integrated/essensys-integrated-study.kicad_sch
          python3 hardware/integrated/check_erc.py /tmp/integrated-erc.json
          kicad-cli sch export netlist --format kicadxml -o /tmp/integrated.xml hardware/integrated/essensys-integrated-study.kicad_sch
          python3 hardware/integrated/check_netlist.py /tmp/integrated.xml
          python3 hardware/integrated/test_erc.py /tmp/integrated-erc.json
          python3 hardware/integrated/test_netlist.py /tmp/integrated.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-r0-study-reports
          path: |
            /tmp/integrated-erc.json
            /tmp/integrated.xml
          if-no-files-found: warn

  pico2-firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 079c6f39023649b154152db30f1d781e884879bc # SDK 2.3.1
          path: .pico-sdk
      - run: git -C .pico-sdk submodule update --init lib/tinyusb
      - name: Toolchain libre Arm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake ninja-build
      - name: Compiler Pico 2
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/.pico-sdk
        run: |
          cmake -S firmware -B build/pico2 -G Ninja -DPICO_BOARD=pico2
          cmake --build build/pico2 --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: pico2-capture-experimental
          path: |
            build/pico2/essensys_pico2.uf2
            build/pico2/essensys_pico2.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rp2350-programmer-diagnostic
          path: |
            build/pico2/essensys_programmer.uf2
            build/pico2/essensys_programmer.elf
          if-no-files-found: error
